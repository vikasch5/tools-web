<!doctype html>
<!-- Source for public/og-image.png (1200x630). Re-render after a rebrand, e.g.

<html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-opsz-normal.woff2);font-weight:200 800}
@font-face{font-family:G;src:url(../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2);font-weight:100 900}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f8f8fc;color:#0F172A}
body{position:relative;font-family:G}
.dots{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(15,23,42,.1) 1px,transparent 0);background-size:22px 22px;-webkit-mask-image:radial-gradient(ellipse at top right,black 10%,transparent 70%)}
.wrap{position:absolute;inset:0;padding:80px 88px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:18px;font-family:B;font-weight:700;font-size:40px;letter-spacing:-.02em}
.mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#ff7a1a,#ec3a76)}
h1{font-family:B;font-weight:800;font-size:92px;line-height:.98;letter-spacing:-.045em;margin:0;max-width:960px}
h1 span{background:linear-gradient(100deg,#4338CA,#7c3aed);-webkit-background-clip:text;color:transparent}
p{font-size:30px;color:#475569;margin:0}
</style></head><body><div class="dots"></div><div class="wrap">
<div class="logo"><img src="../public/images/logo.svg" alt="AllToolsDesk" style="height:56px;width:auto"></div>
<h1>Free online tools that run <span>in your browser</span>.</h1>
<p>PDF, image, developer and text tools · No uploads · No sign-up</p>
</div></body></html>
